# Render Blueprint: hosts PottersPortalServer (see Dockerfile) on Render's
# free plan. In Render: New > Blueprint, pick this repository, then fill in
# the secret values it asks for.
services:
  - type: web
    name: potters-portal-api
    runtime: docker
    plan: free
    # Closest Render region to the Neon database (AWS eu-west-2, London).
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The same Postgres connection string the desktop app uses.
      - key: DATABASE_URL
        sync: false
      # Groq key for photo auto-fill; can be left empty.
      - key: GROQ_API_KEY
        sync: false

  # The mobile app as a website (mobile/, its own repo), so members can open
  # it in a browser or from a home-screen icon without Expo Go.
  - type: web
    name: potters-portal-app
    runtime: static
    repo: https://github.com/manchere/potters-mobile
    branch: master
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time. Without it the web build falls
      # back to http://localhost:8080, which no member's browser can reach.
      - key: EXPO_PUBLIC_API_URL
        value: https://potters-portal-api.onrender.com
    autoDeploy: true
    # The app has one page; send every path to it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API server above, built into the site, e.g.
      # https://potters-portal-api.onrender.com (its URL on its Render page).
      - key: EXPO_PUBLIC_API_URL
        sync: false
