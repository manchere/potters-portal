<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Potter's Inventory — Items</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Potter's Inv." />
</head>
<body>
  <nav class="topnav">
    <span class="brand">Potter's Inventory</span>
    <a href="/">Add Item</a>
    <a href="/items.html" class="active">Items</a>
    <a href="/tags.html">Tags</a>
  </nav>
  <div class="page page-wide">
    <h1 class="page-title">Items</h1>
    <p class="page-subtitle">Edit or delete an item. Click a row's Edit button to change any field, including tags.</p>

    <div id="banner" class="banner" hidden></div>

    <div class="search-box">
      <input type="search" id="search-input" placeholder="Search items by name…" />
    </div>

    <table class="items-table">
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Quantity</th>
          <th>Location</th>
          <th>Status</th>
          <th>Category</th>
          <th>Tags</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
  </div>

  <div id="edit-overlay" class="overlay" hidden>
    <div class="modal card">
      <h2>Edit Item</h2>

      <label class="field">
        <span>Name</span>
        <input type="text" id="edit-name" required />
      </label>

      <label class="field">
        <span>Description</span>
        <textarea id="edit-description" rows="3"></textarea>
      </label>

      <label class="field">
        <span>Quantity</span>
        <input type="number" id="edit-quantity" min="0" />
      </label>

      <label class="field">
        <span>Location</span>
        <input type="text" id="edit-location" />
      </label>

      <div class="field-row">
        <label class="field">
          <span>Status</span>
          <select id="edit-status">
            <option value="available">Available</option>
            <option value="missing">Missing</option>
            <option value="broken">Broken</option>
            <option value="lost">Lost</option>
          </select>
        </label>
        <label class="field">
          <span>Category</span>
          <select id="edit-category"><option value="">None</option></select>
        </label>
      </div>

      <div class="field">
        <span>Tags</span>
        <ul id="edit-tag-list" class="tag-list"></ul>
      </div>

      <div class="field">
        <span>Image</span>
        <img id="edit-image-preview" class="image-preview" hidden />
        <input type="file" id="edit-image-input" accept="image/*" capture="environment" />
      </div>

      <div class="actions">
        <button type="button" id="edit-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="edit-save" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="delete-overlay" class="overlay" hidden>
    <div class="modal card">
      <h2>Delete Item</h2>
      <div class="delete-modal-preview">
        <img id="delete-image-preview" hidden />
        <div id="delete-image-placeholder" class="item-thumb-placeholder" style="width:64px;height:64px;">No image</div>
        <div>
          <strong id="delete-item-name"></strong>
          <p class="field-hint" style="margin-top:4px;">This can't be undone.</p>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="delete-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="delete-confirm" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="/pwa.js"></script>
  <script src="/items.js"></script>
</body>
</html>
