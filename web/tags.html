<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Potter's Inventory — Tags</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Potter's Inv." />
</head>
<body>
  <nav class="topnav">
    <span class="brand">Potter's Inventory</span>
    <a href="/">Add Item</a>
    <a href="/items.html">Items</a>
    <a href="/tags.html" class="active">Tags</a>
  </nav>
  <div class="page">
    <h1 class="page-title">Tags</h1>
    <p class="page-subtitle">Create, recolor, rename, or delete the tags items can be labeled with.</p>

    <div id="banner" class="banner" hidden></div>

    <fieldset class="card">
      <legend>New Tag</legend>
      <div class="field-row field-row-add">
        <label class="field">
          <span>Name</span>
          <input type="text" id="new-tag-name" placeholder="e.g. Electronics" />
        </label>
        <label class="field field-color">
          <span>Color</span>
          <input type="color" id="new-tag-color" value="#3b82f6" />
        </label>
        <label class="field">
          <span>Description</span>
          <input type="text" id="new-tag-description" placeholder="Optional" />
        </label>
        <button type="button" id="add-tag-button" class="btn btn-primary">Add Tag</button>
      </div>
    </fieldset>

    <ul id="tags-list" class="tags-manage-list"></ul>
  </div>

  <script src="/pwa.js"></script>
  <script src="/tags.js"></script>
</body>
</html>
