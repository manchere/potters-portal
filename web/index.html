<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Potter's Inventory — Add Item</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Potter's Inv." />
</head>
<body>
  <nav class="topnav">
    <span class="brand">Potters Inventory</span>
    <a href="/" class="active">Add Item</a>
    <a href="/items.html">Items</a>
    <a href="/tags.html">Tags</a>
  </nav>
  <div class="page">
    <h1 class="page-title">Add Item</h1>
    <p class="page-subtitle">Enter the item's details and optionally tag it before saving.</p>

    <div id="banner" class="banner" hidden></div>

    <form id="item-form">
      <fieldset class="card">
        <legend>Image</legend>
        <img id="image-preview" class="image-preview" hidden />
        <input type="file" id="image-input" accept="image/*" capture="environment" />
        <p class="field-hint">On a phone this can open the camera directly. Optional — you can add it later too.</p>
        <button type="button" id="autofill-button" class="btn btn-secondary" hidden>
          Fill in Name &amp; Description from Photo
        </button>
        <p id="autofill-status" class="field-hint" hidden></p>
      </fieldset>

      <fieldset class="card">
        <legend>Item Details</legend>

        <label class="field">
          <span>Name</span>
          <input type="text" id="name" placeholder="e.g. Folding Table" required />
        </label>

        <label class="field">
          <span>Description</span>
          <textarea id="description" rows="3" placeholder="Optional notes about this item"></textarea>
        </label>

        <label class="field">
          <span>Quantity</span>
          <input type="number" id="quantity" min="0" value="0" />
        </label>

        <label class="field">
          <span>Location</span>
          <input type="text" id="location" placeholder="e.g. Storage Room B, Shelf 3" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Status</span>
            <select id="status">
              <option value="available">Available</option>
              <option value="missing">Missing</option>
              <option value="broken">Broken</option>
              <option value="lost">Lost</option>
            </select>
          </label>
          <label class="field">
            <span>Category</span>
            <select id="category"><option value="">None</option></select>
          </label>
        </div>
      </fieldset>

      <fieldset class="card">
        <legend>Tags</legend>
        <ul id="tag-list" class="tag-list"></ul>
        <div class="field-row">
          <input type="text" id="new-tag-name" placeholder="New tag name" />
          <button type="button" id="add-tag-button" class="btn btn-secondary">Add Tag</button>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" id="save-button" class="btn btn-primary">Add Item</button>
      </div>
    </form>
  </div>

  <script src="/pwa.js"></script>
  <script src="/app.js"></script>
</body>
</html>
